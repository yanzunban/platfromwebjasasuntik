<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YANZZSTORE15 - Platfrom Jasa Suntik Sosial Media</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f172a, #1e3a8a, #7f1d1d, #0f172a);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* --- ANIMASI BACKGROUND GRADIENT --- */
        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- EFEK GELEMBUNG BERGERAK (BUBBLEGUM EFFECT) --- */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            animation: rise 10s infinite ease-in;
        }

        .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 8s; background: rgba(59, 130, 246, 0.2); }
        .bubble:nth-child(2) { left: 25%; width: 20px; height: 20px; animation-duration: 12s; animation-delay: 2s; background: rgba(239, 68, 68, 0.2); }
        .bubble:nth-child(3) { left: 40%; width: 60px; height: 60px; animation-duration: 10s; animation-delay: 4s; }
        .bubble:nth-child(4) { left: 70%; width: 30px; height: 30px; animation-duration: 7s; background: rgba(59, 130, 246, 0.2); }
        .bubble:nth-child(5) { left: 85%; width: 50px; height: 50px; animation-duration: 14s; animation-delay: 1s; background: rgba(239, 68, 68, 0.2); }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            50% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) scale(1.2);
                opacity: 0;
            }
        }

        /* --- CONTAINER UTAMA --- */
        .container {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #3b82f6; /* Aksen Biru */
            border-bottom: 2px solid #ef4444; /* Aksen Merah */
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* --- LOGO & PROFIL --- */
        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .logo-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 30px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- CARD LAYANAN --- */
        .services-title {
            font-size: 14px;
            text-align: left;
            margin-bottom: 10px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .service-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .service-item i {
            font-size: 20px;
            margin-bottom: 8px;
            display: block;
        }

        .service-item.blue i { color: #3b82f6; }
        .service-item.red i { color: #ef4444; }
        .service-item.white i { color: #ffffff; }

        .service-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* --- TOMBOL LINKS / TAUTAN --- */
        .links-title {
            font-size: 14px;
            text-align: left;
            margin-bottom: 10px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Tombol WhatsApp (Aksen Biru-Putih Premium) */
        .btn-whatsapp {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-whatsapp:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* Tombol Instagram (Aksen Merah-Putih Premium) */
        .btn-instagram {
            background: linear-gradient(135deg, #7f1d1d, #ef4444);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-instagram:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .btn-link i {
            font-size: 20px;
        }

        /* --- FOOTER --- */
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble"></div>

        <div class="bubble"></div>
        <div class="bubble"></div>

        <div class="logo-wrapper">

        <h1>YANZZSTORE15</h1>

        <div class="services-grid">

        </div>

        <div class="links-title">Hubungi Kami</div>
        
        <a href="https://wa.me/6289502187092?text=Halo%20YanzzStore15,%20saya%20mau%20order%20jasa%20sosmed" target="_blank" class="btn-link btn-whatsapp">
            <i class="fa-brands fa-whatsapp"></i> Order via WhatsApp
        </a>

        <a href="https://instagram.com/clvuuuyfizz_" target="_blank" class="btn-link btn-instagram">
            <i class="fa-brands fa-instagram"></i> Follow Instagram
        </a>

        <div class="footer">
            &copy; 2026 YANZZSTORE15. All Rights Reserved.
        </div>
    </div>

</body>
</html>
